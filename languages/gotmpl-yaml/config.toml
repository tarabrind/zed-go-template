# The language name doubles as the markdown fence info string (case-insensitive):
# ```gotmpl-yaml
name = "GoTmpl-YAML"
grammar = "gotmpl"
path_suffixes = [
    "yaml.gotmpl",
    "yml.gotmpl",
    "yaml.tmpl",
    "yml.tmpl",
    "yaml.tpl",
    "yml.tpl",
]
line_comments = ["# "]
block_comment = ["{{/* ", " */}}"]
tab_size = 2
brackets = [
    { start = "{{", end = "}}", close = true, newline = false },
    { start = "{{-", end = "-}}", close = true, newline = false },
    { start = "(", end = ")", close = true, newline = false },
]
