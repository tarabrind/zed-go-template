# The language name doubles as the markdown fence info string (case-insensitive):
# ```gotmpl-html
name = "GoTmpl-HTML"
grammar = "gotmpl"
path_suffixes = [
    "html.gotmpl",
    "htm.gotmpl",
    "html.tmpl",
    "htm.tmpl",
    "html.tpl",
    "htm.tpl",
    "gohtml",
]
block_comment = ["{{/* ", " */}}"]
brackets = [
    { start = "{{", end = "}}", close = true, newline = false },
    { start = "{{-", end = "-}}", close = true, newline = false },
    { start = "(", end = ")", close = true, newline = false },
]
